<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="How jevex learns: the first time, no candidate fits, so an LLM reads the statement, Jev verifies its answer and a generator is learned from it; the next time, the generator finds the value and no LLM is called">
  <title>How jevex learns: the first time, no candidate fits, so an LLM reads the statement, Jev verifies its answer and a generator is learned from it; the next time, the generator finds the value and no LLM is called</title>
  <!-- Learning loop: LLM fallback → verified → generator → no LLM next time.
       Drawn by scripts/draw_illustrations.py; edit it there. -->
  <style>
    @keyframes unsure { 0%, 2%, 9%, 100% { transform: scale(1) } 5.5% { transform: scale(1.3) } }
    .unsure { animation: unsure 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes a1 { 0%, 9% { opacity: 0 } 11%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }
    .a1 { animation: a1 12s ease-in-out infinite; }
    @keyframes llm { 0%, 10% { opacity: 0; transform: scale(0.4) } 13% { opacity: 1; transform: scale(1.15) } 15%, 90% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
    .llm { animation: llm 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes a2 { 0%, 17% { opacity: 0 } 19%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }
    .a2 { animation: a2 12s ease-in-out infinite; }
    @keyframes jev1 { 0%, 19% { opacity: 0; transform: scale(0.4) } 21.4% { opacity: 1; transform: scale(1.15) } 23%, 90% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
    .jev1 { animation: jev1 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes tick1 { 0%, 23% { opacity: 0; transform: scale(0.4) } 25.4% { opacity: 1; transform: scale(1.15) } 27%, 90% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
    .tick1 { animation: tick1 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes a3 { 0%, 27% { opacity: 0 } 29%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }
    .a3 { animation: a3 12s ease-in-out infinite; }
    @keyframes value1 { 0%, 29% { opacity: 0; transform: scale(0.4) } 31.4% { opacity: 1; transform: scale(1.15) } 33%, 90% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
    .value1 { animation: value1 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes learn { 0%, 35% { stroke-dashoffset: 1; opacity: 1 } 45%, 90% { stroke-dashoffset: 0; opacity: 1 } 96%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    .learn { animation: learn 12s ease-in-out infinite; }
    .learn { stroke-dasharray: 1 1; }
    @keyframes learn-end { 0%, 44% { opacity: 0 } 47%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }
    .learn-end { animation: learn-end 12s ease-in-out infinite; }
    @keyframes gen { 0%, 46% { opacity: 0; transform: scale(0.4) } 49% { opacity: 1; transform: scale(1.15) } 51%, 90% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
    .gen { animation: gen 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes b1 { 0%, 51% { opacity: 0 } 53%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }
    .b1 { animation: b1 12s ease-in-out infinite; }
    @keyframes b2 { 0%, 53% { opacity: 0 } 55%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }
    .b2 { animation: b2 12s ease-in-out infinite; }
    @keyframes jev2 { 0%, 55% { opacity: 0; transform: scale(0.4) } 57.4% { opacity: 1; transform: scale(1.15) } 59%, 90% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
    .jev2 { animation: jev2 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes tick2 { 0%, 58% { opacity: 0; transform: scale(0.4) } 60.4% { opacity: 1; transform: scale(1.15) } 62%, 90% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
    .tick2 { animation: tick2 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes b3 { 0%, 62% { opacity: 0 } 64%, 90% { opacity: 1 } 96%, 100% { opacity: 0 } }
    .b3 { animation: b3 12s ease-in-out infinite; }
    @keyframes value2 { 0%, 64% { opacity: 0; transform: scale(0.4) } 66.4% { opacity: 1; transform: scale(1.15) } 68%, 90% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
    .value2 { animation: value2 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cheer { 0%, 68%, 75%, 100% { transform: translateY(0) } 71.5% { transform: translateY(-14px) } }
    .cheer { animation: cheer 12s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
