  <text x="125" y="173" font-size="12.5" fill="#5B21B6" text-anchor="middle" font-family="system-ui,sans-serif">no candidate fits</text>
  <text x="325" y="152" font-size="17" fill="#1E1B4B" font-family="'Nunito','Avenir Next',ui-rounded,system-ui,sans-serif" font-weight="700" text-anchor="middle">LLM fallback</text>
