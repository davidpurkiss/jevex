  <text x="495" y="152" font-size="17" fill="#1E1B4B" font-family="'Nunito','Avenir Next',ui-rounded,system-ui,sans-serif" font-weight="700" text-anchor="middle">verified</text>
  <text x="495" y="173" font-size="12.5" fill="#5B21B6" text-anchor="middle" font-family="system-ui,sans-serif">Jev checks the answer</text>
  <text x="650" y="152" font-size="17" fill="#1E1B4B" font-family="'Nunito','Avenir Next',ui-rounded,system-ui,sans-serif" font-weight="700" text-anchor="middle">value</text>
  <text x="650" y="173" font-size="12.5" fill="#5B21B6" text-anchor="middle" font-family="system-ui,sans-serif">a verified example</text>
