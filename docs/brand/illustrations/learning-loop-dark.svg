    <g class="tick2">
      <circle cx="548" cy="308" r="13" fill="#0F0D24" stroke="#7C3AED" stroke-width="2.5"/>
      <path d="M542 308 L546.2 312.2 L554 303.8" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
