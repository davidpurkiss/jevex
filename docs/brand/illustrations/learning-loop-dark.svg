    <text x="325" y="105" font-size="20" fill="#1E1B4B" font-family="'Nunito','Avenir Next',ui-rounded,system-ui,sans-serif" font-weight="800" text-anchor="middle">LLM</text>
  </g>
  <g fill="none" stroke="#DDD6FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="a2">
