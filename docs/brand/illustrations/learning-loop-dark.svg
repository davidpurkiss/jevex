    <rect x="56" y="333" width="120" height="5" rx="2.5" fill="#7C3AED"/>
    <rect x="56" y="345" width="104" height="5" rx="2.5" fill="#7C3AED"/>
  </g>
  <g fill="none" stroke="#DDD6FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="b1">
    <path d="M218 334 L262 334 M255 328 L262 334 L255 340"/>
