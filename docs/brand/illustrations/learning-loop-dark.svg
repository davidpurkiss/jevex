  <text x="125" y="173" font-size="12.5" fill="#C4B5FD" text-anchor="middle" font-family="system-ui,sans-serif">no candidate fits</text>
  <text x="325" y="152" font-size="17" fill="#F5F3FF" font-family="'Nunito','Avenir Next',ui-rounded,system-ui,sans-serif" font-weight="700" text-anchor="middle">LLM fallback</text>
  <text x="325" y="173" font-size="12.5" fill="#C4B5FD" text-anchor="middle" font-family="system-ui,sans-serif">reads the statement</text>
