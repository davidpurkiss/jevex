        <circle cx="78" cy="70" r="11" fill="#FFFFFF"/><circle cx="81" cy="72" r="5" fill="#1E1B4B"/>
        <path d="M52 92 Q 63 102 74 92" fill="none" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round"/>
