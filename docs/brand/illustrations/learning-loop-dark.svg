    <g class="tick1">
      <circle cx="548" cy="72" r="13" fill="#0F0D24" stroke="#7C3AED" stroke-width="2.5"/>
      <path d="M542 72 L546.2 76.2 L554 67.8" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g fill="none" stroke="#DDD6FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="a3">
