  <text x="125" y="388" font-size="17" fill="#F5F3FF" font-family="'Nunito','Avenir Next',ui-rounded,system-ui,sans-serif" font-weight="700" text-anchor="middle">statement</text>
  <text x="125" y="409" font-size="12.5" fill="#C4B5FD" text-anchor="middle" font-family="system-ui,sans-serif">same pattern, new page</text>
  <text x="325" y="388" font-size="17" fill="#F5F3FF" font-family="'Nunito','Avenir Next',ui-rounded,system-ui,sans-serif" font-weight="700" text-anchor="middle">generator</text>
