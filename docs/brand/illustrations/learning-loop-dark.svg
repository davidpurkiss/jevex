  <rect x="16" y="250" width="768" height="186" rx="18" fill="#1E1B4B"/>
  <text x="40" y="282" font-size="18" fill="#F5F3FF" font-family="'Nunito','Avenir Next',ui-rounded,system-ui,sans-serif" font-weight="800">Next time</text>
