[project]
name = "jevex"
version = "0.0.1"
description = "Extract typed records from web pages and PDFs using Jev, with LLM fallbacks that learn declarative generators."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "David Purkiss" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "typesafe-sdk>=0.7.2",
]
keywords = ["extraction", "scraping", "pdf", "html", "pydantic", "jev", "llm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/davidpurkiss/jevex"
Repository = "https://github.com/davidpurkiss/jevex"
Issues = "https://github.com/davidpurkiss/jevex/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/design-spec.md is kept verbatim; don't reformat its code samples.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "TC"]
# Table-cell statements use these on purpose, e.g. "Performance › 0-62 mph (s) · SE: 9.1".
allowed-confusables = ["›", "·", "–", "×"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so their imports must stay at module level.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra", "--disable-socket", "--allow-unix-socket"]
