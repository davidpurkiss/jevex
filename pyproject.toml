[project]
name = "jevex"
dynamic = ["version"]
description = "Extract typed records from web pages and PDFs using Jev, with LLM fallbacks that learn declarative generators."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "David Purkiss" }]
requires-python = ">=3.12"
dependencies = [
    "google-re2>=1.1.20251105",
    "httpx2>=2.13",
    "protego>=0.7.0",
    "pydantic>=2.11",
    "pysbd>=0.3.4",
    "pyyaml>=6.0.2",
    "typesafe-sdk>=0.7.2",
]
keywords = ["extraction", "scraping", "pdf", "html", "pydantic", "jev", "llm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

[project.scripts]
jevex = "jevex.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/davidpurkiss/jevex"
Repository = "https://github.com/davidpurkiss/jevex"
Issues = "https://github.com/davidpurkiss/jevex/issues"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.9.0",
]
openai = [
    "openai>=3.22.0",
]
litellm = [
    "litellm>=1.83.0",
]
ocr = [
    # RapidOCR ships its detection and recognition models in the wheel, so OCR works
    # offline with nothing to download.
    "onnxruntime>=1.20",
    "pillow>=10.0",
    "rapidocr>=3.9.2",
]
pdf = [
    "docling>=2.131.0",
    # Renders pictures and scanned pages for the image stage (Docling uses it too).
    "pypdfium2>=4.30",
    # Listed so uv can take them from the CPU index on Linux (see [tool.uv.sources]).
    "torch>=2.2.2",
    "torchvision>=0.17",
]
gemini = [
    "google-genai>=2.26.0",
]

[tool.hatch.version]
path = "src/jevex/__init__.py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0",
]

# Docling (the `pdf` extra) needs torch. On Linux, PyPI's torch pulls in several GB of CUDA
# libraries, so the dev and CI environments take the CPU-only build instead. Users
# installing jevex[pdf] get whichever torch their own installer picks.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/design-spec.md is kept verbatim; don't reformat its code samples.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "TC"]
# Table-cell statements use these on purpose, e.g. "Performance › 0-62 mph (s) · SE: 9.1".
allowed-confusables = ["›", "·", "–", "×", "’"]

[tool.ruff.lint.per-file-ignores]
# HTML templates and the phrasing bank read better unwrapped.
"src/jevex/testsite/render.py" = ["E501"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so their imports must stay at module level.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra", "--disable-socket", "--allow-unix-socket"]
