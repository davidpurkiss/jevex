# The pinned benchmark setup (docs/benchmarks.md). jevex.benchmarks.BenchmarkConfig reads
# it. Change it only together with a new results run, and record why in the results.
version: 1
seed: 42
concurrency: 8
budget_usd: 25.0
bootstrap:
  samples: 1000
  confidence: 0.95

# Prices are USD per million tokens, as published on price_date.
jev:
  provider: jev
  model: jev-1.13.0
  input_usd_per_mtok: 0.042
  output_usd_per_mtok: 0.0
  price_date: 2026-10-01

models:
  # jevex's own LLMs: the fallback uses the fast baseline's model, so jevex (cold) and
  # LLM-only (fast) differ in method, not in model.
  extraction:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    input_usd_per_mtok: 1.00
    output_usd_per_mtok: 5.00
    price_date: 2026-10-01
  generator:
    provider: anthropic
    model: claude-opus-5-5
    input_usd_per_mtok: 4.00
    output_usd_per_mtok: 20.00
    price_date: 2026-10-01
  baseline_fast:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    input_usd_per_mtok: 1.00
    output_usd_per_mtok: 5.00
    price_date: 2026-10-01
  baseline_strong:
    provider: anthropic
    model: claude-opus-5-5
    input_usd_per_mtok: 4.00
    output_usd_per_mtok: 20.00
    price_date: 2026-10-01
  # Gemini's current Flash, the tier most Gemini users extract with. Its price is
  # Google's offer until 2026-12-31 (from 2027: $1.50 and $7.50).
  baseline_gemini:
    provider: gemini
    model: gemini-3.8-flash
    input_usd_per_mtok: 0.75
    output_usd_per_mtok: 3.75
    price_date: 2026-10-01

# Locks are relative to this file. Each corpus names the schemas it's labelled in and the
# pipeline jevex runs on it; its documents hold several records unless entities: single.
corpora:
  - name: testsite
    kind: testsite
    seed: 42
    lock: corpora/testsite.lock
    schemas: [jevex.testsite.schemas:VehicleSpec, jevex.testsite.schemas:Listing]
    entities: multi
  # books.toscrape.com pages, kept with the results rather than committed: fetch them with
  # jevex corpus books into the directory the env var names.
  - name: books
    kind: books
    seed: 42
    sample: 200
    env: JEVEX_BENCH_BOOKS
    lock: corpora/books.lock
    schemas: [jevex.examples.books:Book]
    pipeline: jevex.examples.books:books_pipeline
  # Real UK manufacturers' price guides and spec pages, never committed: fetch them from
  # their manifest with corpora/fetch.py into the directory the env var names.
  - name: spec-sheets
    kind: directory
    env: JEVEX_BENCH_SPEC_SHEETS
    lock: corpora/spec-sheets.lock
    schemas: [jevex.testsite.schemas:VehicleSpec]
    entities: multi
